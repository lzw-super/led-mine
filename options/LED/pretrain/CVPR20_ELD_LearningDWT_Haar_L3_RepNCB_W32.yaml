# Architecture source: train_sid_sony_learning_dwt_haar_l3_d32_atlas_ll3_cnn_concat1x1_repncb_w32_ll_repncb_hf_cnn_depth5_repncb_prelu_residual_ll_no_norm.yaml
# Training bases match CVPR20_ELD_Setting.yaml; preserve the reference graph.
base:
- options/base/dataset/pretrain/SID_raw_gt.yaml           # train dataset
- options/base/dataset/test/SID_SonyA7S2_val_split.yaml   # test dataset
- options/base/noise_g/noise_g_virtual.yaml               # noise_g
- options/base/pretrain/CVPR20_ELD.yaml                   # train
- options/base/val_and_logger.yaml                        # val + logger

name: LED_Pretrain_CVPR20_ELD_LearningDWT_Haar_L3_RepNCB_W32
model_type: RAWImageDenoisingModel
scale: 1
num_gpu: 1
manual_seed: 2022

model_complexity:
  input_shape: [1, 4, 512, 512]
  raw_pixel_scale: 2

path:
  pretrain_network_g: ~
  predefined_noise_g: pretrained/noise_g/VirtualNoisyPairGenerator_ELD_ptrqc_5VirtualCameras.pth
  strict_load_g: true
  resume_state: ~
  CRF: datasets/EMoR

val:
  illumination_correct: true

repnr_opt: null  # No UNet-specific RepNR conversion.

network_g:
  type: SIDReferenceDenoiser
  architecture: learning_dwt_repncb
  settings:
    dwt_width: 16
    dwt_depth: 3
    dwt_context: atlas
    dwt_shrink_ll: false
    dwt_leak: 0.0
    dwt_normalize_bands: true
    dwt_pad_input: true
    dwt_init_threshold: 0.01
    dwt_init_ll_threshold: 0.001
    dwt_wavelet: haar
    dwt_levels: 3
    dwt_magnitude_input: true
    dwt_condition_bands: false
    dwt_ll_max_threshold: 0.01
    dwt_shrink_mode: soft
    dwt_ll_mode: ll_only
    dwt_ll_width: 32
    dwt_ll_depth: 5
    dwt_ll_fusion: concat_1x1
    refine_s2d_factor: 2
    refine_width: 32
    refine_num_blocks: 5
    refine_skip_source: noisy
    dwt_ll_block_type: repncb
    dwt_threshold_mode: hf_cnn
    dwt_hf_cnn_variant: repncb_prelu_residual
    dwt_ll_normalize: false
