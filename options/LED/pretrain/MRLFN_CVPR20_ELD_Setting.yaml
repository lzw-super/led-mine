base:
- options/base/dataset/pretrain/SID_raw_gt.yaml           # clean SID long-exposure RAW patches
- options/base/dataset/test/SID_SonyA7S2_val_split.yaml   # paired SID validation splits
- options/base/network_g/mrlfn.yaml                       # MRLFN train-time reparameterized graph
- options/base/noise_g/noise_g_virtual.yaml               # five virtual cameras, ptrqc noise
- options/base/pretrain/CVPR20_ELD.yaml                   # LED optimizer, scheduler and loader settings
- options/base/val_and_logger.yaml                        # validation and logging

name: LED_Pretrain_MRLFN_CVPR20_ELD_Setting
model_type: RAWImageDenoisingModel
scale: 1
num_gpu: 1
manual_seed: 2026

# Keep the paper's RAW reconstruction/chromatic objective while following the
# LED virtual-camera pretraining data and optimization pipeline.
train:
  pixel_opt:
    type: RawReconstructionChromaticLoss
    raw_weight: 0.6
    chromatic_weight: 0.4
    loss_weight: 1.0
    reduction: mean
    channel_order: [0, 1, 2, 3]  # [R, G1, B, G2]

# SID_raw_gt consists of 4-channel 512x512 packed-RAW patches. A packed pixel
# represents a 2x2 Bayer region. Both train and fused deployment complexity
# are written to the training log at startup.
model_complexity:
  input_shape: [1, 4, 512, 512]
  raw_pixel_scale: 2

path:
  pretrain_network_g: ~
  predefined_noise_g: /home/shared_files/model-weight/led/VirtualNoisyPairGenerator_ELD_ptrqc_5VirtualCameras.pth
  param_key_g: params
  strict_load_g: true
  resume_state: ~
  CRF: datasets/EMoR

val:
  illumination_correct: true
